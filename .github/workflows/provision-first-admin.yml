name: Provision first Claris administrator

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Confirm that the remote migrations have completed and the first administrator should be provisioned
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: claris-first-admin-production
  cancel-in-progress: false

jobs:
  provision:
    name: Provision the first administrator
    if: ${{ inputs.confirm }}
    runs-on: ubuntu-latest
    environment: vps
    timeout-minutes: 10
    env:
      CLARIS_FIRST_ADMIN_EMAIL: ${{ secrets.CLARIS_FIRST_ADMIN_EMAIL }}
      CLARIS_FIRST_ADMIN_FULL_NAME: ${{ secrets.CLARIS_FIRST_ADMIN_FULL_NAME }}
      CLARIS_FIRST_ADMIN_PASSWORD: ${{ secrets.CLARIS_FIRST_ADMIN_PASSWORD }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Validate provisioning configuration
        run: |
          set -euo pipefail
          for value_name in CLARIS_FIRST_ADMIN_EMAIL CLARIS_FIRST_ADMIN_FULL_NAME CLARIS_FIRST_ADMIN_PASSWORD SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_URL; do
            [ -n "${!value_name:-}" ] || { echo "::error::Configure $value_name in the vps environment"; exit 1; }
          done
          [ "${#CLARIS_FIRST_ADMIN_PASSWORD}" -ge 12 ] || { echo '::error::CLARIS_FIRST_ADMIN_PASSWORD must have at least 12 characters'; exit 1; }
          case "$SUPABASE_URL" in https://*) ;; *) echo '::error::SUPABASE_URL must be HTTPS'; exit 1 ;; esac
          case "$SUPABASE_PROJECT_REF" in ''|*[!a-zA-Z0-9-]*) echo '::error::SUPABASE_PROJECT_REF is invalid'; exit 1 ;; esac

      - name: Resolve a temporary server API key
        run: |
          set -euo pipefail
          export API_KEYS_JSON="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys?reveal=true")"
          SUPABASE_SERVICE_ROLE_KEY="$(node -e '
            const keys = JSON.parse(process.env.API_KEYS_JSON)
            const candidate = keys.find((key) =>
              typeof key?.api_key === "string" && (
                key.name === "service_role" || key.name === "secret" || key.api_key.startsWith("sb_secret_")
              ),
            )
            if (!candidate) throw new Error("No server API key is available for the project")
            process.stdout.write(candidate.api_key)
          ')"
          unset API_KEYS_JSON
          echo "::add-mask::$SUPABASE_SERVICE_ROLE_KEY"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY" >> "$GITHUB_ENV"

      - name: Provision administrator idempotently
        run: npm run provision:first-admin
