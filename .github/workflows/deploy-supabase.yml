name: Deploy Claris backend to Supabase

on:
  push:
    branches: [main]
    paths:
      - supabase/functions/**
      - supabase/config.toml
      - scripts/deploy-supabase-functions.mjs
      - package.json
      - package-lock.json
      - .github/workflows/deploy-supabase.yml
  workflow_dispatch:
    inputs:
      deploy_functions:
        description: Publicar as Edge Functions
        required: true
        default: true
        type: boolean
      apply_migrations:
        description: Aplicar migrations pendentes no banco remoto (altera o Supabase)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: claris-supabase-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate backend changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run

  deploy:
    name: Deploy approved backend changes
    needs: validate
    runs-on: ubuntu-latest
    environment: vps
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Validate deployment credentials
        run: |
          set -euo pipefail
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo '::error::Configure SUPABASE_ACCESS_TOKEN as a secret in the vps environment'; exit 1; }
          case "$SUPABASE_PROJECT_REF" in
            ''|*[!a-zA-Z0-9-]*) echo '::error::Configure SUPABASE_PROJECT_REF with the hosted project reference'; exit 1 ;;
          esac

      - name: Deploy Edge Functions
        if: ${{ github.event_name == 'push' || inputs.deploy_functions }}
        run: npm run supabase:functions:deploy -- --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply pending database migrations
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_migrations }}
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$SUPABASE_DB_PASSWORD" ] || { echo '::error::Configure SUPABASE_DB_PASSWORD as a secret before applying migrations'; exit 1; }
          npx --yes supabase@latest link --project-ref "$SUPABASE_PROJECT_REF"
          npx --yes supabase@latest db push --linked --dry-run
          npx --yes supabase@latest db push --linked --yes
