project_id = "local"

[analytics]
enabled = false

[api]
enabled = true
port = 65421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 65422
shadow_port = 65420
major_version = 15

[edge_runtime]
policy = "per_worker"

[studio]
enabled = true
port = 65423
api_url = "http://127.0.0.1:65421"

[inbucket]
enabled = true
port = 65424
smtp_port = 65425
pop3_port = 65426

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:8080"
additional_redirect_urls = [
  "http://localhost:8080",
  "http://localhost:8080/auth/accept-invite",
  "http://localhost:8080/reset-password",
  "http://127.0.0.1:8080",
  "http://127.0.0.1:8080/auth/accept-invite",
  "http://127.0.0.1:8080/reset-password",
  "http://localhost:3000",
  "http://localhost:3000/auth/accept-invite",
  "http://localhost:3000/reset-password",
  "http://127.0.0.1:3000",
  "http://127.0.0.1:3000/auth/accept-invite",
  "http://127.0.0.1:3000/reset-password"
]
jwt_expiry = 3600
enable_signup = false

